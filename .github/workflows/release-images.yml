name: Release images

# Builds the two images the Coolify stack runs and pushes them to GHCR, then pins the stack to this
# commit's tags and asks Coolify to redeploy. The VPS never compiles anything: it pulls.
#
# This runs only after CI has passed on the same commit, so a build that does not compile or whose
# client fails svelte-check can never reach the server. That is why the trigger is `workflow_run`
# rather than `push`: two workflows both listening for a push to main would race, and the images
# would ship regardless of the result.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    # CI also runs on pull requests; only a successful push to main should ship. A manual dispatch
    # carries no workflow_run payload and is trusted on its own.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    permissions:
      contents: read
      packages: write
    # Job level, because the secrets context is not available in a step's `if`.
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
    steps:
      # A workflow_run event's own `github.sha` is the head of the default branch, not the commit CI
      # judged. Everything below has to build and tag the commit that actually passed.
      - id: rev
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.rev.outputs.sha }}

      # GHCR paths must be lowercase; a repository owner may not be.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Planner.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-api:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-api:${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image (website + client + routing)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          # The image carries the commit it was built from, so the client's status bar names it.
          build-args: |
            PLANNER_BUILD_SHA=${{ steps.rev.outputs.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-web:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-web:${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Writes the commit-SHA tags into the stack's variables before deploying, so what is running is
      # recorded rather than whatever `latest` happened to point at, and a rollback is setting the
      # previous SHA instead of reconstructing it. Skipped until COOLIFY_URL and COOLIFY_APP_UUID are
      # configured; the deploy below then uses the tags already set on the stack.
      - name: Pin the stack to this commit's images
        if: ${{ env.COOLIFY_URL != '' && env.COOLIFY_APP_UUID != '' && env.COOLIFY_TOKEN != '' }}
        env:
          OWNER: ${{ steps.owner.outputs.name }}
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          curl --fail-with-body --silent --show-error --location --request PATCH \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            --header "Content-Type: application/json" \
            --data @- \
            "${COOLIFY_URL%/}/api/v1/applications/$COOLIFY_APP_UUID/envs/bulk" <<JSON
          {"data":[
            {"key":"PLANNER_API_IMAGE","value":"$REGISTRY/$OWNER/planner-api:$SHA"},
            {"key":"PLANNER_WEB_IMAGE","value":"$REGISTRY/$OWNER/planner-web:$SHA"}
          ]}
          JSON

      # Both images exist before anything is deployed, so a failed build never leaves the stack
      # half-updated. Skipped automatically until the Coolify secrets are configured.
      - name: Trigger the Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' && env.COOLIFY_TOKEN != '' }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK_URL"
