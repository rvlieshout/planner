# Standalone VPS stack. Do not merge with docker-compose.yml.
name: planner-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      # PostgreSQL 18 stores PGDATA in /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    image: planner-api:${PLANNER_API_TAG:-demo}
    build:
      context: .
      dockerfile: src/Planner.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Planner: "Host=db;Database=planner;Username=planner;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      Planner__Database__AutoMigrate: "true"
      Planner__Auth__KeyDirectory: /var/lib/planner/keys
      Planner__Auth__KeyPassword: ${PLANNER_KEY_PASSWORD:?set PLANNER_KEY_PASSWORD}
      # TLS terminates at Caddy; the API has no host port.
      Planner__Auth__AllowInsecureHttp: "true"
      Planner__Seed__OwnerEmail: ${PLANNER_OWNER_EMAIL:?set PLANNER_OWNER_EMAIL}
      Planner__Seed__OwnerPassword: ${PLANNER_OWNER_PASSWORD:?set PLANNER_OWNER_PASSWORD}
      Planner__Seed__SeedDemoData: ${PLANNER_SEED_DEMO:-false}
      Planner__Updates__Enabled: "true"
      Planner__Updates__Directory: /var/lib/planner/updates
      Planner__Updates__RequestPath: /updates
    volumes:
      - keys:/var/lib/planner/keys
      - /srv/planner/releases:/var/lib/planner/updates:ro
    logging: *logging

  caddy:
    image: planner-website:${PLANNER_WEBSITE_TAG:-demo}
    build:
      context: .
      dockerfile: website/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PLANNER_DOMAIN: ${PLANNER_DOMAIN:?set PLANNER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  keys:
  caddy_data:
  caddy_config:
