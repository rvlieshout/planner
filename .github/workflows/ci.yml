name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Build the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # The AppHost is left out on purpose: it bundles the Aspire CLI and only ever runs on a
      # developer machine. What ships is the API image.
      - run: dotnet build src/Planner.Api/Planner.Api.csproj -c Release

  website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

  client:
    name: Build and check the web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # svelte-check is the client's compiler: it type-checks the TypeScript and every binding in
      # every component, standing in for the compile-time check that .NET's shared Contracts project
      # gives the API.
      - run: npm run check
        working-directory: client
      - run: npm run build
        working-directory: client
