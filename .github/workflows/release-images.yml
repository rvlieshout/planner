name: Release images

# Builds the two images the Coolify stack runs and pushes them to GHCR, then asks Coolify to
# redeploy. The VPS never compiles anything: it pulls.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Job level, because the secrets context is not available in a step's `if`.
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # GHCR paths must be lowercase; a repository owner may not be.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Planner.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-api:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the website image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: website/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-web:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/planner-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Both images exist before anything is deployed, so a failed build never leaves the stack
      # half-updated. Skipped automatically until the Coolify secrets are configured.
      - name: Trigger the Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK_URL"
