name: planner

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planner}
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      # Deterministic collation, so index ordering does not shift with the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores PGDATA in /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planner} -d ${POSTGRES_DB:-planner}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Planner.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Planner: "Host=db;Port=5432;Database=${POSTGRES_DB:-planner};Username=${POSTGRES_USER:-planner};Password=${POSTGRES_PASSWORD:-planner};Include Error Detail=true"

      Planner__Database__AutoMigrate: "true"

      # Attachment bytes. Without an absolute, writable path the API falls back to a directory under
      # its own application folder, which the container's non-root user cannot create.
      Attachments__Path: /var/lib/planner/attachments

      Planner__Auth__KeyDirectory: /var/lib/planner/keys
      Planner__Auth__KeyPassword: ${PLANNER_KEY_PASSWORD:-planner-dev-keys}
      Planner__Auth__AccessTokenMinutes: "60"
      Planner__Auth__RefreshTokenDays: "14"
      # The API speaks plain HTTP inside the compose network; terminate TLS at your reverse proxy.
      Planner__Auth__AllowInsecureHttp: "true"
      Planner__Auth__AllowedOrigins__0: ${PLANNER_ALLOWED_ORIGIN:-http://localhost:8080}

      Planner__Seed__OwnerEmail: ${PLANNER_OWNER_EMAIL:-owner@planner.local}
      Planner__Seed__OwnerPassword: ${PLANNER_OWNER_PASSWORD:?set PLANNER_OWNER_PASSWORD in .env}
      Planner__Seed__OwnerDisplayName: ${PLANNER_OWNER_NAME:-Planner Owner}
      Planner__Seed__SeedDemoData: ${PLANNER_SEED_DEMO:-false}
    ports:
      - "${PLANNER_PORT:-8080}:8080"
    volumes:
      - plannerkeys:/var/lib/planner/keys
      - plannerattachments:/var/lib/planner/attachments

  # The front door: the website at /, the browser client at /app, and everything else
  # proxied to the API. It is the same image the VPS runs, so a local check exercises the real
  # routing rather than a development server's approximation of it.
  #
  # The API keeps its own published port because the docs, tools/planner.http and the desktop client
  # all address it directly; the browser client never does, and only ever speaks to this container.
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PLANNER_WEB_PORT:-8081}:80"

  # Optional: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@planner.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-planner}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  plannerkeys:
  plannerattachments:
